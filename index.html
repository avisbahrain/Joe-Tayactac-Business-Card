<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Joe Tayactac — Avis Rent A Car</title>
<style>
  :root{
    --red:#D70926;
    --red2:#A50014;
    --dark:#1E1F22;
    --grey:#6A6D74;
    --lightgrey:#E3E4E7;
    --bg:#EEF0F2;
    --card:#FFFFFF;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#101114;
      --card:#1B1C20;
      --dark:#F2F2F3;
      --grey:#A3A6AC;
      --lightgrey:#35373C;
    }
  }
  :root[data-theme="dark"]{
    --bg:#101114;
    --card:#1B1C20;
    --dark:#F2F2F3;
    --grey:#A3A6AC;
    --lightgrey:#35373C;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{
    height:100%;
    margin:0;
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  body{
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:28px 16px 40px;
    min-height:100%;
  }
  .wrap{ width:100%; max-width:420px; }

  .card{
    position:relative;
    overflow:hidden;
    background:var(--card);
    border-radius:22px;
    padding:24px 22px 20px;
    box-shadow:0 14px 34px rgba(0,0,0,0.14), 0 2px 6px rgba(0,0,0,0.06);
  }

  /* faint brand watermark */
  .watermark{
    position:absolute;
    right:-6px;
    bottom:-18px;
    font-size:190px;
    font-weight:900;
    line-height:1;
    color:var(--red);
    opacity:0.05;
    font-family:Helvetica,Arial,sans-serif;
    pointer-events:none;
    user-select:none;
    z-index:0;
  }

  /* diagonal corner accent, bottom-right */
  .corner{
    position:absolute;
    right:0;
    bottom:0;
    width:120px;
    height:120px;
    clip-path:polygon(100% 0%, 100% 100%, 0% 100%);
    background:linear-gradient(135deg,#ef2340,var(--red2));
    z-index:0;
  }
  .corner::before{
    content:"";
    position:absolute;
    right:14px;
    bottom:-10px;
    width:170px;
    height:6px;
    background:rgba(255,255,255,0.55);
    transform:rotate(-45deg);
    transform-origin:right bottom;
  }

  .content{ position:relative; z-index:1; }

  .top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .name{
    font-size:24px;
    font-weight:800;
    color:var(--dark);
    line-height:1.15;
    margin:0;
  }
  .title{
    font-size:12.5px;
    font-weight:800;
    letter-spacing:0.03em;
    color:var(--red);
    text-transform:uppercase;
    margin:6px 0 0;
  }
  .underline{
    width:46px;
    height:3px;
    background:var(--red);
    border-radius:2px;
    margin-top:10px;
  }
  .logo{
    height:32px;
    width:auto;
    flex-shrink:0;
    margin-top:2px;
  }

  .company{
    font-size:14px;
    font-weight:700;
    color:var(--dark);
    margin:18px 0 2px;
  }
  .subco{
    font-size:12px;
    color:var(--grey);
    margin:0 0 16px;
  }

  .rows{ display:flex; flex-direction:column; gap:4px; }
  a.row, div.row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:8px 6px;
    margin:0 -6px;
    border-radius:10px;
    text-decoration:none;
    color:var(--dark);
    -webkit-tap-highlight-color: rgba(215,9,38,0.12);
  }
  a.row:active{ background:rgba(215,9,38,0.08); }

  .badge{
    width:34px;
    height:34px;
    border-radius:50%;
    background:var(--red);
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 2px 6px rgba(215,9,38,0.35);
  }
  .badge svg{ width:17px; height:17px; }

  .divider{
    width:1px;
    align-self:stretch;
    background:var(--lightgrey);
    margin:2px 0;
  }

  .rowvalue{
    font-size:14.5px;
    font-weight:600;
    color:var(--dark);
    overflow-wrap:anywhere;
  }
  .rowsub{
    font-size:12.5px;
    color:var(--grey);
    font-weight:500;
    margin-left:4px;
  }

  .addr-row{ margin-top:6px; align-items:flex-start; }
  .addr-text{
    font-size:12.5px;
    color:var(--grey);
    padding-top:8px;
    line-height:1.35;
  }

  .save{
    position:relative;
    z-index:1;
    margin-top:18px;
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:var(--red);
    color:#fff;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
  }
  .save:active{ opacity:0.85; }
  .hint{
    position:relative;
    z-index:1;
    text-align:center;
    font-size:11.5px;
    color:var(--grey);
    margin-top:10px;
  }
</style>
</head>

<script>
(function(){
  var vcard = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    "N:Tayactac;Joe;;;",
    "FN:Joe Tayactac",
    "TITLE:Sales & Leasing Assistant",
    "ORG:Avis Rent A Car;Al Haddad Vehicle Rental & Leasing W.L.L.",
    "TEL;TYPE=WORK,VOICE:+973 17782200,4211",
    "TEL;TYPE=CELL:+973 32001109",
    "EMAIL;TYPE=WORK:leasing@avisbahrain.com",
    "URL:https://www.avisbahrain.com/",
    "ADR;TYPE=WORK:;;P.O. Box 242;Manama;;;Kingdom of Bahrain",
    "END:VCARD"
  ].join("\r\n");

  var btn = document.getElementById("saveBtn");
  var hint = document.getElementById("hint");

  btn.addEventListener("click", async function(){
    try{
      if (window.claude && window.claude.use) {
        var downloads = await window.claude.use("downloads");
        if (downloads) {
          await downloads.save({
            filename: "Joe_Tayactac_Avis.vcf",
            data: vcard
          });
          return;
        }
      }
      fallbackDownload();
    }catch(e){
      fallbackDownload();
    }
  });

  function fallbackDownload(){
    try{
      var blob = new Blob([vcard], {type:"text/vcard"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "Joe_Tayactac_Avis.vcf";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    }catch(e){
      hint.textContent = "Couldn't save automatically — screenshot this card instead.";
    }
  }
})();
</script>
